<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ECMO Live</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0a0f1e; --card: #11141a; --card-2: #171c26; --line: #252b38;
    --text: #f2f5fa; --muted: #8e98aa; --accent: #00eeff; --accent-ink: #00262b;
    --good: #33ff33; --bad: #ff5a5a; --warn: #ffcc00; --red: #ff3333; --teal: #4db6ac;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
  body { min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; margin: 0; color: var(--muted); }
  h1 b { color: var(--accent); }
  .pill { font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--good); border-color: #1d5a1d; }
  .pill.warn { color: var(--warn); border-color: #6b5a00; }
  .vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tile .lbl { font-size: 11px; font-weight: bold; letter-spacing: 1px; }
  .tile .val { font-family: 'Courier New', monospace; font-size: 30px; font-weight: bold; line-height: 1.1; margin-top: 2px; white-space: nowrap; }
  .tile .sub { font-size: 12px; color: var(--muted); min-height: 15px; }
  .ticker { font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; min-height: 34px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .eyebrow { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: bold; margin-bottom: 8px; }
  .q { font-size: 20px; line-height: 1.3; font-weight: bold; margin: 0 0 12px; }
  details { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  details summary { cursor: pointer; color: var(--accent); font-weight: bold; font-size: 13px; padding: 4px 0; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; margin: 0 0 10px; padding: 10px 14px; text-align: left; color: var(--text); background: var(--card-2); border: 2px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; cursor: pointer; }
  .opt:active { transform: scale(.99); }
  .opt .k { flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #232a38; color: var(--muted); font-weight: bold; font-size: 14px; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: #062a30; }
  .opt[aria-pressed="true"] .k { background: var(--accent); color: var(--accent-ink); }
  .opt:disabled { cursor: default; opacity: .75; }
  .note { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 18px; }
  .note.good { color: var(--good); } .note.bad { color: var(--bad); }
  .res { position: relative; overflow: hidden; margin: 0 0 10px; border: 2px solid var(--line); border-radius: 12px; background: var(--card-2); min-height: 54px; }
  .res .bar { position: absolute; inset: 0 auto 0 0; background: #123b44; width: 0; transition: width .6s ease; }
  .res.best { border-color: var(--good); } .res.best .bar { background: #12461a; }
  .res.mine { border-color: var(--accent); }
  .res .row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; font-size: 15px; }
  .res .tags { font-size: 11px; font-weight: bold; letter-spacing: .5px; color: var(--muted); margin-top: 3px; }
  .res .n { font-family: 'Courier New', monospace; font-weight: bold; white-space: nowrap; }
  .wait { text-align: center; color: var(--muted); padding: 26px 8px; font-size: 16px; line-height: 1.5; }
  .wait .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  footer { margin-top: 16px; font-size: 11px; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .wait .dot { animation: none } .res .bar { transition: none } }
</style>
</head>
<body>
<header>
  <h1><b>ECMO</b> Live</h1>
  <span id="conn" class="pill warn">Connecting…</span>
</header>

<section class="vitals" aria-label="Patient and circuit values">
  <div class="tile"><div class="lbl" style="color:#33ff33">HR</div><div class="val" id="v-hr" style="color:#33ff33">--</div><div class="sub">bpm</div></div>
  <div class="tile"><div class="lbl" style="color:#00eeff">SpO₂</div><div class="val" id="v-spo2" style="color:#00eeff">--</div><div class="sub">%</div></div>
  <div class="tile"><div class="lbl" style="color:#ff5a5a">ABP</div><div class="val" id="v-abp" style="color:#ff5a5a;font-size:24px;padding-top:4px">--</div><div class="sub" id="v-map">&nbsp;</div></div>
  <div class="tile"><div class="lbl" style="color:#4db6ac">ECMO FLOW</div><div class="val" id="v-flow" style="color:#4db6ac">--</div><div class="sub" id="v-rpm">&nbsp;</div></div>
</section>
<div class="ticker" id="ticker">Waiting for the presenter…</div>

<main class="card" id="main" aria-live="polite"></main>
<footer>Votes are anonymous. Keep this page open during the session.</footer>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var host = (q.get('db') || '').toLowerCase(), code = (q.get('s') || '').toLowerCase();
  var HOST_RE = /^[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/, CODE_RE = /^[a-z0-9]{6,12}$/;
  var linkOk = HOST_RE.test(host) && CODE_RE.test(code);
  var base = 'https://' + host + '/s/' + code;

  var cid;
  try { cid = localStorage.getItem('ecmo_cid'); } catch (e) {}
  if (!cid) {
    cid = 'c' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    try { localStorage.setItem('ecmo_cid', cid); } catch (e) {}
  }

  var S = { pub: null, mine: null, conn: false, denied: false, error: '', pollId: null };
  var LETTERS = 'ABCDEFGHIJ';

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  // Rebuild the local copy of a Firebase value from its streaming events.
  function setIn(root, parts, val) {
    var node = root;
    for (var i = 0; i < parts.length - 1; i++) {
      if (node[parts[i]] === null || typeof node[parts[i]] !== 'object') node[parts[i]] = {};
      node = node[parts[i]];
    }
    var k = parts[parts.length - 1];
    if (val === null || val === undefined) delete node[k]; else node[k] = val;
  }
  function applyEvent(root, type, path, data) {
    var parts = String(path || '/').split('/').filter(Boolean);
    if (type === 'put') {
      if (!parts.length) return data;
      if (root === null || typeof root !== 'object') root = {};
      setIn(root, parts, data); return root;
    }
    if (root === null || typeof root !== 'object') root = {};
    Object.keys(data || {}).forEach(function (k) { setIn(root, parts.concat(k.split('/').filter(Boolean)), data[k]); });
    return root;
  }
  function listen(url, onValue) {
    var root = null, es = new EventSource(url);
    es.onopen = function () { S.conn = true; S.denied = false; pill(); };
    es.onerror = function () { S.conn = false; pill(); };
    function h(type) { return function (e) { var m; try { m = JSON.parse(e.data); } catch (x) { return; } root = applyEvent(root, type, m.path, m.data); onValue(root); }; }
    es.addEventListener('put', h('put')); es.addEventListener('patch', h('patch'));
    es.addEventListener('cancel', function () { es.close(); S.conn = false; S.denied = true; pill(); renderMain(); });
  }

  function pill() {
    var c = $('conn');
    c.textContent = S.denied ? 'No access' : S.conn ? 'Live' : 'Connecting…';
    c.className = 'pill ' + (S.conn ? 'ok' : 'warn');
  }
  function opts(p) {
    var o = p.options || {};
    return Object.keys(o).map(function (id) { return { id: id, label: String((o[id] || {}).l || id), order: (o[id] || {}).o || 0 }; })
      .sort(function (a, b) { return a.order - b.order; });
  }
  function state() { return S.pub && S.pub.state ? S.pub.state : null; }

  function renderVitals() {
    var v = S.pub && S.pub.vitals ? S.pub.vitals : null, st = state();
    $('v-hr').textContent = v && v.hr != null ? v.hr : '--';
    $('v-spo2').textContent = v && v.spo2 != null ? v.spo2 : '--';
    $('v-abp').textContent = v && v.sbp != null ? v.sbp + '/' + v.dbp : '--';
    $('v-map').textContent = v && v.map != null ? 'MAP ' + v.map : ' ';
    $('v-flow').textContent = v && v.flow != null ? Number(v.flow).toFixed(1) : '--';
    $('v-rpm').textContent = v && v.rpm != null ? 'L/min · ' + v.rpm + ' RPM' : ' ';
    $('ticker').textContent = (v && v.msg) ? v.msg : (st && st.live ? 'Session running' : 'Waiting for the presenter…');
  }

  function renderMain() {
    var m = $('main'); m.textContent = '';
    if (!linkOk) { m.appendChild(el('div', 'wait', 'This page needs the link from the QR code on the presenter’s screen. Please scan it again.')); return; }
    if (S.denied) { m.appendChild(el('div', 'wait', 'Could not join this session. Ask the presenter to check the setup.')); return; }
    var st = state();
    if (!st || !st.live) {
      var w = el('div', 'wait'); w.appendChild(el('span', 'dot')); w.appendChild(document.createTextNode('Waiting for the presenter to start the session'));
      m.appendChild(w); return;
    }
    var p = st.poll;
    if (!p) {
      m.appendChild(el('div', 'eyebrow', 'Update'));
      m.appendChild(el('p', 'q', st.banner || 'No question open. Watch the main screen.'));
      return;
    }
    var list = opts(p);
    if (p.status === 'open') {
      m.appendChild(el('div', 'eyebrow', p.kind === 'scenario' ? 'Scenario question' : 'Quick poll'));
      m.appendChild(el('p', 'q', p.question));
      if (p.narrative) { var d = el('details'); d.appendChild(el('summary', null, 'Read the scenario')); d.appendChild(el('div', null, p.narrative)); m.appendChild(d); }
      list.forEach(function (o, i) {
        var b = el('button', 'opt'); b.type = 'button';
        b.setAttribute('aria-pressed', S.mine === o.id ? 'true' : 'false');
        b.appendChild(el('span', 'k', LETTERS[i] || '•')); b.appendChild(el('span', null, o.label));
        b.addEventListener('click', function () { vote(p.id, o.id); });
        m.appendChild(b);
      });
      m.appendChild(el('div', 'note' + (S.error ? ' bad' : S.mine ? ' good' : ''), S.error || (S.mine ? 'Vote recorded. You can change it until voting closes.' : 'Tap an answer to vote.')));
      return;
    }
    m.appendChild(el('div', 'eyebrow', 'Results'));
    m.appendChild(el('p', 'q', p.question));
    var total = p.total || 0, tally = p.tally || {};
    list.forEach(function (o, i) {
      var n = tally[o.id] || 0, pct = total ? Math.round(n * 100 / total) : 0;
      var r = el('div', 'res' + (p.bestId === o.id ? ' best' : '') + (S.mine === o.id ? ' mine' : ''));
      var bar = el('div', 'bar'); r.appendChild(bar);
      var row = el('div', 'row'), left = el('div'); left.appendChild(el('div', null, LETTERS[i] + '. ' + o.label));
      var tags = [];
      if (S.mine === o.id) tags.push('YOUR VOTE');
      if (p.bestId === o.id) tags.push('BEST ANSWER');
      if (p.appliedId === o.id) tags.push('CHOSEN BY THE ROOM');
      if (tags.length) left.appendChild(el('div', 'tags', tags.join(' · ')));
      row.appendChild(left); row.appendChild(el('div', 'n', n + ' · ' + pct + '%'));
      r.appendChild(row); m.appendChild(r);
      requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.width = pct + '%'; }); });
    });
    m.appendChild(el('div', 'note', total + (total === 1 ? ' vote' : ' votes') + '. Next question will appear here.'));
  }

  function vote(pollId, choice) {
    var prev = S.mine; S.mine = choice; S.error = ''; renderMain();
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    fetch(base + '/votes/' + cid + '.json', { method: 'PUT', body: JSON.stringify({ poll: pollId, choice: choice }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); })
      .catch(function () { S.mine = prev; S.error = 'Could not send your vote. Check your connection.'; renderMain(); });
  }
  function restoreVote(pollId) {
    fetch(base + '/votes/' + cid + '.json').then(function (r) { return r.json(); }).then(function (v) {
      if (v && v.poll === pollId && S.pollId === pollId) { S.mine = v.choice; renderMain(); }
    }).catch(function () {});
  }
  function beat() { fetch(base + '/presence/' + cid + '.json', { method: 'PUT', body: JSON.stringify({ '.sv': 'timestamp' }) }).catch(function () {}); }

  renderVitals(); renderMain(); pill();
  if (!linkOk) { $('conn').textContent = 'No link'; return; }
  listen(base + '/pub.json', function (pub) {
    S.pub = pub && typeof pub === 'object' ? pub : null;
    var st = state(), id = st && st.poll ? st.poll.id : null;
    if (id !== S.pollId) { S.pollId = id; S.mine = null; S.error = ''; if (id) restoreVote(id); }
    renderMain(); renderVitals();
  });
  beat(); setInterval(beat, 20000);
})();
</script>
</body>
</html>
